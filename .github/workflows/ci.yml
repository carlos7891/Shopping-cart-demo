name: CI - Tests, Coverage (>=80%) & Strict Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared, Backend and Frontend (Strict TypeScript)
        run: npm run build

      - name: Run Unit & Integration Tests with Coverage Gate (>=80%)
        run: npm run test:coverage
